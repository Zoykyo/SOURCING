# ──────────────────────────────────────────────────────────────────────────────
# Role Profile — one file per requisition.
# In Phase 1 this gets auto-populated from a Zoho Recruit Job Opening.
# ──────────────────────────────────────────────────────────────────────────────

id: ME-2026-001
title: "Senior Mechanical Design Engineer"
# REQUIRED — who we are sourcing FOR. Ask/confirm at the start of every search.
# The engine protects this client (and all active clients) from no-poach.
client: "Airbus Canada"
seniority: senior                 # junior | intermediate | senior | lead | principal

# Sector key from engine/reference/target_employers.yaml. When set, the engine
# auto-fills target_employers with that sector's companies (relevance boost) and
# enables no-poach checks against active clients.
sector: aeronautique_espace       # defense | aeronautique_espace | vehicules | ferroviaire | villes_infrastructure

region: "Montréal, QC"
work_mode: hybrid                 # onsite | hybrid | remote
relocation_offered: false

# Must-have skills act as a GATE. Missing any flags the candidate "below bar".
must_have_skills:
  - "mechanical design"
  - "CATIA"
  - "GD&T"
  - "aerospace"

nice_to_have_skills:
  - "ANSYS"
  - "finite element analysis"
  - "composites"
  - "DFMEA"
  - "Teamcenter"

# Key OEMs / relevant companies (Professional Profile category).
target_employers:
  - "Bombardier"
  - "Pratt & Whitney"
  - "Airbus"
  - "Bell"
  - "CAE"
  - "Safran"

# Domain standards (Skills category).
standards:
  - "AS9100"
  - "SAE"
  - "ISO 9001"

languages:
  - {name: "French", level: "professional"}
  - {name: "English", level: "professional"}

# Optional: override the model's default category weights for this role.
# Omit to use model.yaml defaults. Must sum to 1.0 if provided.
# category_weights:
