    - panelist
    - \bpanel\b
    - trainer
    - instructor
    - committee
    - chair(person)?
    - board member
    - mentor
  publications:
    - patent
    - publication
    - published
    - first author
    - peer.reviewed
    - journal
    - conference paper
  competition:
    - competition
    - student club
    - hackathon
    - olympiad
    - contest
    - formula sae
    - sae aero
    - design challenge
  education:
